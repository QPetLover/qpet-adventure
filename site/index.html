<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>qpet-adventure · QQ 宠物冒险岛</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #10141b;
        }
        #container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #container ruffle-player {
            flex-shrink: 0;
            width: 100%;
            height: 100%;
        }
        #notice {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 640px;
            margin: 0;
            padding: 20px 24px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            background: rgba(20, 24, 32, 0.92);
            color: #e8edf4;
            font: 15px/1.7 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        #notice code {
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.12);
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="notice">
        <h2>还没有找到冒险岛游戏文件</h2>
        <p>站点和字体资源已经就绪，但 <code>site/xmxd.swf</code> 还没有归档到仓库。</p>
        <p>请把冒险岛游戏 SWF 放到 <code>site/xmxd.swf</code>（或通过 <code>qpet-adventure</code> npm 包发布），刷新后即可运行。</p>
    </div>
    <script src="vendor/ruffle/ruffle.js"></script>
    <script>
        const GAME_URL = 'xmxd.swf';

        window.addEventListener('load', async () => {
            let gameAvailable = true;
            try {
                const response = await fetch(GAME_URL, { method: 'HEAD', cache: 'no-cache' });
                gameAvailable = response.ok;
            } catch (error) {
                gameAvailable = false;
            }

            if (!gameAvailable) {
                document.getElementById('notice').style.display = 'block';
                return;
            }

            window.RufflePlayer.config = {
                fontSources: ['myfont.swf'],
                defaultFonts: {
                    sans: ['站酷快乐体2016修订版'],
                },
                scale: 'showAll',
                forceScale: true,
                autoplay: 'on',
                unmuteOverlay: 'hidden',
            };
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById('container');
            container.appendChild(player);
            player.load(GAME_URL);
        });
    </script>
</body>
</html>
